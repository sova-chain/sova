name: Box binaries

# E1c: release builds of the two host binaries sova-in-a-box runs
# (`bin/sova` and `sova-miner`), so `box/up.sh` can fetch them instead of
# spending 11-25 minutes compiling reth on a stranger's first run (see
# docs/reports/e1-stranger-test.md and box/up/README.md, "Prebuilt
# binaries"). Two modes:
#
# 1. workflow_dispatch -> an Actions *artifact* per platform, as before.
#    Artifacts inherit the repo's visibility, need `gh` (logged in) to
#    download, and expire on the repo's retention setting; when they do,
#    `box/up.sh` just falls back to building from source.
# 2. push of a `v*` tag -> the same builds, packed as one tarball per
#    platform and attached to that tag's GitHub Release together with a
#    release-level SHA256SUMS and BUILD-INFO. Release assets never expire
#    and download with plain curl, no login: this is the M0 path a
#    stranger's `./box/up.sh` uses first.
#
# Artifact layout, one per platform, named `sova-box-bin-<platform>`
# (<platform> = darwin-arm64 | linux-x86_64 -- the same strings
# `box/up.sh`'s `box_platform` produces):
#   sova          release binary (bin/sova)
#   sova-miner    release binary (crates/burn-wallet, a nested workspace)
#   SHA256SUMS    `sha256sum` format, both binaries
#   BUILD-INFO    key=value: commit, platform, ref, rustc, run id
# Upload zips files and drops the executable bit; `box/up.sh` verifies
# SHA256SUMS and marks the binaries executable when it installs them. It
# only uses an artifact whose BUILD-INFO commit has the same Rust sources
# (bin/, crates/, Cargo.toml, Cargo.lock, .cargo/, rust-toolchain*) as the
# checkout it runs in.
#
# Release layout (tag vX.Y.Z), assets at
# https://github.com/<owner>/<repo>/releases/download/vX.Y.Z/<asset>:
#   sova-box-bin-darwin-arm64.tar.gz   the four artifact files above
#   sova-box-bin-linux-x86_64.tar.gz   the four artifact files above
#   SHA256SUMS                         `sha256sum` format, both tarballs
#   BUILD-INFO                         commit, tag, platforms, run id
# The release job only runs if BOTH platforms built, so a release never
# carries one platform's binaries without the other's. If the release
# already exists (e.g. drafted with notes by hand), assets are uploaded
# to it (--clobber); otherwise it is created.
#
# Does not replace or gate anything in ci.yml: it is a separate, non-
# required workflow with its own cache keys, so it never evicts the lint /
# build-test caches.
#
# Linux portability (stranger test 2026-09-25, F4): the linux-x86_64 leg
# builds inside Ubuntu 20.04 (glibc 2.31) with scripts/build-linux-release.sh,
# targeting x86-64-v2, and fails if either binary needs a glibc newer than
# 2.31. Built directly on ubuntu-latest, `sova` needed glibc 2.38 and
# didn't start on Ubuntu 22.04, Debian 12 or RHEL 9. The smoke step then
# runs both binaries in ubuntu:20.04, debian:12 and ubuntu:22.04.
#
# Version: SOVA_VERSION (the tag on a tag push) is stamped into
# `sova --version` and `sova-miner --version` (bin/sova/build.rs).
#
# This workflow only runs in the public repo (github.com/sova-chain/sova):
# a change here takes effect with the next `v*` tag pushed there.

# No branch pushes: the macos-14 leg bills at 10x Actions minutes on a
# private repo, so building on every Rust push to `release` would burn the
# quota. Dispatch it when a demo build is wanted (gh workflow run
# box-binaries.yml --ref release), or push a `v*` tag to cut a release.
# box/up.sh's source-match check still decides whether an artifact fits
# the checkout. The Rust build inputs are RUST_INPUT_PATHS in box/up.sh.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: read

# A newer dispatch/tag push of the same ref supersedes an in-flight build.
concurrency:
  group: box-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same reasoning as ci.yml: incremental artifacts bloat the cache and a
  # fresh checkout rarely reuses them.
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # Cold reth release build is ~11 min on an M3; hosted runners are
    # slower, and the Linux leg builds in a container without a cache.
    # Generous so a cold build never times out.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
          - runner: ubuntu-latest
            platform: linux-x86_64
    env:
      # The tag on a tag push (v0.1.3 -> `sova --version` prints 0.1.3);
      # empty on a dispatch, where build.rs falls back to the commit.
      SOVA_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      # macOS: the runner's own toolchain. Linux builds in a container
      # (below), which installs its own.
      - if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable
      # Same conventions as ci.yml (two workspaces, cache-on-failure), with
      # a release-profile, per-platform shared key of its own.
      - if: runner.os == 'macOS'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sova-box-release-${{ matrix.platform }}
          workspaces: |
            . -> target
            crates/burn-wallet -> target
          cache-on-failure: true
      - name: Build bin/sova (release)
        if: runner.os == 'macOS'
        run: cargo build --release --locked -p sova
      # crates/burn-wallet is its own nested workspace (see ci.yml).
      - name: Build sova-miner (release)
        if: runner.os == 'macOS'
        run: cargo build --release --locked -p sova-miner --manifest-path crates/burn-wallet/Cargo.toml
      # Ubuntu 20.04 (glibc 2.31), x86-64-v2; fails above glibc 2.31.
      - name: Build sova + sova-miner (release, glibc 2.31 container)
        if: runner.os == 'Linux'
        env:
          SOVA_LINUX_TARGET: ${{ runner.temp }}/linux-target
          SOVA_LINUX_CARGO: ${{ runner.temp }}/linux-cargo
          CARGO_TERM_COLOR: always
        run: scripts/build-linux-release.sh target/release-linux
      # The binaries must start on the distributions the guide promises,
      # not just on the build container: --version, and the testnet
      # genesis hash (chainspec only, no node).
      - name: Smoke-test on older distributions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for img in ubuntu:20.04 debian:12 ubuntu:22.04; do
            echo "== ${img}"
            docker run --rm -v "${PWD}/target/release-linux:/b:ro" \
              -e SOVA_CHAIN=sova-testnet -e SOVA_SIP7=1 "${img}" \
              sh -c 'ldd --version | head -1; /b/sova --version && /b/sova-miner --version && /b/sova genesis-hash'
          done
      # The CPU floor: start a follow-only node on an emulated Nehalem
      # (x86-64-v2, no AVX/BMI2/ADX). v0.1.3 died here with SIGILL in
      # blst's mulx_mont_384 (ADX, enabled because the build runner had
      # it) while loading the KZG setup, right after "Loaded storage
      # settings". Discovery off: it contacts nobody.
      - name: Smoke-test on an x86-64-v2 CPU (qemu Nehalem)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user >/dev/null
          datadir="$(mktemp -d)"
          rc=0
          NO_COLOR=1 RUST_LOG_STYLE=never SOVA_CHAIN=sova-testnet SOVA_GOSSIP=p2p SOVA_EPOCH_BASE=4388500 \
            SOVA_EMISSION_SCHEDULE=flat SOVA_SIP6=1 SOVA_SIP7=1 SOVA_FOLLOW_ONLY=1 \
            SOVA_DISCOVERY=off SOVA_BOOTNODES='' SOVA_DATADIR="${datadir}" \
            timeout 120 qemu-x86_64 -cpu Nehalem-v1 target/release-linux/sova >node.log 2>&1 || rc=$?
          tail -n 20 node.log
          # Still running when the timeout stopped it, as it should be: sova
          # catches the SIGTERM and exits 0 after a clean shutdown ("shutdown
          # complete"); 124 if it had to be killed. A crash (132 = SIGILL on
          # an unsupported instruction, the v0.1.3 failure) fails the step.
          case "${rc}" in 0 | 124) ;; *) echo "sova exited ${rc}"; exit 1 ;; esac
          # Log lines may carry ANSI colour codes between words.
          grep -qE 'Status.*connected_peers' node.log
          grep -q 'shutdown complete' node.log
      - name: Stage artifact
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/sova-box-bin-${PLATFORM}"
          mkdir -p "${out}"
          if [[ "${RUNNER_OS}" == Linux ]]; then
            cp target/release-linux/sova target/release-linux/sova-miner "${out}/"
          else
            cp target/release/sova "${out}/sova"
            cp crates/burn-wallet/target/release/sova-miner "${out}/sova-miner"
          fi
          # Fails the job here, not on a stranger's machine, if the
          # binary can't even start on the platform it was built for.
          "${out}/sova-miner" --version
          "${out}/sova" --version
          # A tag build must report its tag.
          if [[ -n "${SOVA_VERSION}" ]]; then
            test "$("${out}/sova" --version)" = "sova ${SOVA_VERSION#v}"
            test "$("${out}/sova-miner" --version)" = "sova-miner ${SOVA_VERSION#v}"
          fi
          cd "${out}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum sova sova-miner >SHA256SUMS
          else
            shasum -a 256 sova sova-miner >SHA256SUMS
          fi
          {
            echo "commit=${GITHUB_SHA}"
            echo "platform=${PLATFORM}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "version=$("${out}/sova" --version)"
            if [[ "${RUNNER_OS}" == Linux ]]; then
              echo "build=ubuntu-20.04-container glibc<=2.31 target-cpu=x86-64-v2"
            else
              echo "rustc=$(rustc --version)"
            fi
            echo "run_id=${GITHUB_RUN_ID}"
          } >BUILD-INFO
          cat SHA256SUMS BUILD-INFO
          echo "ARTIFACT_DIR=${out}" >>"${GITHUB_ENV}"
      - uses: actions/upload-artifact@v4
        with:
          name: sova-box-bin-${{ matrix.platform }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          compression-level: 6
      # Tag builds only: the same four files as one tarball (keeps the
      # executable bit, one download per platform) for the release job.
      - name: Pack release tarball
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          # macOS tar: no AppleDouble `._*` entries for extended attributes.
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/sova-box-bin-${PLATFORM}.tar.gz"
          tar -czf "${tarball}" -C "${ARTIFACT_DIR}" sova sova-miner SHA256SUMS BUILD-INFO
          tar -tzf "${tarball}"
          echo "TARBALL=${tarball}" >>"${GITHUB_ENV}"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: sova-box-release-${{ matrix.platform }}
          path: ${{ env.TARBALL }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: attach to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that writes: creating/updating this tag's release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sova-box-release-*
          path: dist
          merge-multiple: true
      - name: Release SHA256SUMS + BUILD-INFO
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          platforms="darwin-arm64 linux-x86_64"
          for p in ${platforms}; do
            test -f "sova-box-bin-${p}.tar.gz"
            # Each tarball's own BUILD-INFO must name this commit.
            inner="$(tar -xzOf "sova-box-bin-${p}.tar.gz" BUILD-INFO)"
            printf '%s\n' "${inner}"
            test "$(printf '%s\n' "${inner}" | sed -n 's/^commit=//p')" = "${GITHUB_SHA}"
            test "$(printf '%s\n' "${inner}" | sed -n 's/^platform=//p')" = "${p}"
          done
          sha256sum sova-box-bin-*.tar.gz >SHA256SUMS
          {
            echo "commit=${GITHUB_SHA}"
            echo "tag=${TAG}"
            echo "platforms=${platforms}"
            echo "run_id=${GITHUB_RUN_ID}"
          } >BUILD-INFO
          cat SHA256SUMS BUILD-INFO
      - name: Create or update the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=(dist/sova-box-bin-darwin-arm64.tar.gz dist/sova-box-bin-linux-x86_64.tar.gz dist/SHA256SUMS dist/BUILD-INFO)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --clobber
          else
            gh release create "${TAG}" "${files[@]}" --verify-tag --title "${TAG}" \
              --notes "sova-in-a-box prebuilt binaries for ${TAG} (macOS arm64, Linux x86_64). \`./box/up.sh\` in a checkout of this tag downloads and verifies them automatically; see box/up/README.md."
          fi

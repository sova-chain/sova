# zebrad (Zcash testnet) on an M1 testnet host. Mounted read-only into the
# container at /home/zebra/.config/zebrad.toml (the path box/regtest's
# compose file proves for zfnd/zebra:6.3.0). setup-host.sh substitutes
# @ZEBRA_P2P_PORT@ and @ZEBRA_RPC_PORT@.

[network]
network = "Testnet"
# Inbound Zcash P2P is only reachable where the Hetzner firewall opens it
# (seed hosts, D9: a courtesy testnet peer). Elsewhere it is outbound-only.
listen_addr = "0.0.0.0:@ZEBRA_P2P_PORT@"

[state]
# On the data volume, so a rebuilt server re-attaches it instead of
# re-syncing. Snapshots (docs/ops/snapshots.md) are taken from here.
cache_dir = "/var/lib/sova/zebrad"

[rpc]
# Loopback only. Never offered as a public service (infra-m1 §4.3).
listen_addr = "127.0.0.1:@ZEBRA_RPC_PORT@"
# Cookie auth is OFF on these single-purpose hosts, a documented deviation
# from infra-m1 §4.3: bin/sova's zebrad client has no cookie-file support
# (zebrad rewrites the cookie on every start, so it can't be baked into
# SOVA_ZEBRAD_RPC). RPC stays on 127.0.0.1 and no other users exist on the
# host. Turn it on once bin/sova reads a cookie file (runbook follow-up).
enable_cookie_auth = false

[tracing]
use_color = false

[package]
name = "sova-da-contract"
description = "Sova NEAR DA index: checks and records every SOVADA1 batch posted to it (docs/design/near-da.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository = "https://github.com/sova-chain/sova"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.91.0"
image_digest = ""
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.29"
sovada = { path = "../format" }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
tiny-keccak = { version = "2", features = ["keccak"] }

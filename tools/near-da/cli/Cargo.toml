[package]
name = "sova-near-da"
description = "Posts Sova blocks to NEAR (the DA archive) and fetches/verifies them back (docs/design/near-da.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sova-near-da"
path = "src/main.rs"

[dependencies]
sovada = { path = "../format" }
# Rebuilding a block's RLP from eth_* when the node has no debug_getRawBlock
# (sova.rs). Same versions as the node's own lock (reth v2.6.0), so the
# header field set matches what the node hashes.
alloy-consensus = { version = "=2.4.2", default-features = false, features = ["std", "serde"] }
alloy-eips = { version = "=2.4.2", default-features = false, features = ["std", "serde"] }
alloy-rpc-types-eth = { version = "=2.4.2", default-features = false, features = ["std", "serde"] }
alloy-primitives = { version = "1.7", default-features = false, features = ["std"] }
alloy-rlp = "0.3"
base64 = "0.22"
bs58 = "0.5"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny-keccak = { version = "2", features = ["keccak"] }
ureq = { version = "2", features = ["json", "tls"] }
